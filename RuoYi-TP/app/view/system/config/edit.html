<!DOCTYPE html>
<html lang="zh">
<head>
	{assign name="pageTitle" value="修改参数" /}
	{include file="include/header" /}
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-config-edit">
            <input id="configId" name="configId" value="{$config.config_id ?? ''}" type="hidden">
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">参数名称：</label>
                <div class="col-sm-8">
                    <input id="configName" name="configName" value="{$config.config_name ?? ''}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">参数键名：</label>
                <div class="col-sm-8">
                    <input id="configKey" name="configKey" value="{$config.config_key ?? ''}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">参数键值：</label>
                <div class="col-sm-8">
                    <textarea id="configValue" name="configValue" class="form-control" rows="4" required>{$config.config_value ?? ''}</textarea>
                </div>
            </div>
			<div class="form-group">
				<label class="col-sm-3 control-label">系统内置：</label>
				<div class="col-sm-8">
				    {volist name="datas" id="vo"}<div class="radio-box">
						<input type="radio" id="configType{$i}" name="configType" value="{$vo.dict_value}" {if condition="$vo['dict_value'] == $config['config_type']"}checked{/if}>
						<label for="configType{$i}">{$vo.dict_label}</label>
					</div>{/volist}
				</div>
			</div>
			<div class="form-group">
	            <label class="col-sm-3 control-label">备注：</label>
	            <div class="col-sm-8">
	                <textarea id="remark" name="remark" class="form-control">{$config.remark ?? ''}</textarea>
	            </div>
	        </div>
    	</form>
    </div>
    {include file="include/footer" /}
    <script type="text/javascript">
	    var prefix = ctx + "system/config";

	    $("#form-config-edit").validate({
	    	onkeyup: false,
	        rules: {
	            configKey: {
	                remote: {
	                    url: prefix + "/checkConfigKeyUnique",
	                    type: "post",
	                    dataType: "json",
	                    data: {
	                        "configId": function() {
	                        	return $("#configId").val();
	                        },
	                        "configKey": function() {
	                        	return $.common.trim($("#configKey").val());
	                        }
	                    }
	                }
	            },
	        },
	        messages: {
	            "configKey": {
	                remote: "参数键名已经存在"
	            }
	        },
	        focusCleanup: true
	    });

	    function submitHandler() {
	        if ($.validate.form()) {
	        	$.operate.save(prefix + "/edit", $('#form-config-edit').serialize());
	        }
	    }
    </script>
</body>
</html>
