<!DOCTYPE html>
<html lang="zh">
<head>
	{assign name="pageTitle" value="参数列表" /}
	{include file="include/header" /}
</head>
<body class="gray-bg">
     <div class="container-div">
		<div class="row">
			<div class="col-sm-12 search-collapse">
				<form id="config-form">
					<div class="select-list">
						<ul>
							<li>
								参数名称：<input type="text" name="configName"/>
							</li>
							<li>
								参数键名：<input type="text" name="configKey"/>
							</li>
							<li>
								系统内置：<select name="configType">
									<option value="">所有</option>
									{volist name="datas" id="d"}<option value="{$d.dict_value}">{$d.dict_label}</option>{/volist}
								</select>
							</li>
							<li class="select-time">
								<label>创建时间： </label>
								<input type="text" class="time-input" id="startTime" placeholder="开始时间" name="params[beginTime]"/>
								<span>-</span>
								<input type="text" class="time-input" id="endTime" placeholder="结束时间" name="params[endTime]"/>
							</li>
							<li>
								<a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
								<a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
							</li>
						</ul>
					</div>
				</form>
			</div>

	        <div class="btn-group-sm" id="toolbar" role="group">
		        <a class="btn btn-success {:check_perm('system:config:add') ? '' : 'hidden'}" onclick="$.operate.add()">
		            <i class="fa fa-plus"></i> 新增
		        </a>
		        <a class="btn btn-primary single disabled {:check_perm('system:config:edit') ? '' : 'hidden'}" onclick="$.operate.edit()">
		            <i class="fa fa-edit"></i> 修改
		        </a>
		        <a class="btn btn-danger multiple disabled {:check_perm('system:config:remove') ? '' : 'hidden'}" onclick="$.operate.removeAll()">
		            <i class="fa fa-remove"></i> 删除
		        </a>
		        <a class="btn btn-warning {:check_perm('system:config:export') ? '' : 'hidden'}" onclick="$.table.exportExcel()">
		            <i class="fa fa-download"></i> 导出
		        </a>
		        <a class="btn btn-danger {:check_perm('system:config:remove') ? '' : 'hidden'}" onclick="refreshCache()">
		            <i class="fa fa-refresh"></i> 刷新缓存
		        </a>
	        </div>
	        <div class="col-sm-12 select-table table-striped">
	            <table id="bootstrap-table"></table>
	        </div>
	    </div>
	</div>
    {include file="include/footer" /}
    <script>
        var editFlag = '{:check_perm('system:config:edit') ? '' : 'hidden'}';
        var removeFlag = '{:check_perm('system:config:remove') ? '' : 'hidden'}';
        var datas = {:json_encode($datas)};
        var prefix = ctx + "system/config";

        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                sortName: "configId",
		        sortOrder: "asc",
                modalName: "参数",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'configId',
                    title: '参数主键'
                },
                {
                    field: 'configName',
                    title: '参数名称',
                    formatter: function(value, row, index) {
                        return $.table.tooltip(value);
                    }
                },
                {
                    field: 'configKey',
                    title: '参数键名',
                    formatter: function(value, row, index) {
                        return $.table.tooltip(value);
                    }
                },
                {
                    field: 'configValue',
                    title: '参数键值',
                    align: 'center',
                    formatter: function(value, row, index) {
                        return $.table.tooltip(value, 10, "open");
                    }
                },
                {
                    field: 'configType',
                    title: '系统内置',
                    align: 'center',
                    formatter: function(value, row, index) {
                        return $.table.selectDictLabel(datas, value);
                    }
                },
                {
                    field: 'remark',
                    title: '备注',
                    align: 'center',
                    formatter: function(value, row, index) {
                        return $.table.tooltip(value, 10, "open");
                    }
                },
                {
                    field: 'createTime',
                    title: '创建时间'
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.configId + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.configId + '\')"><i class="fa fa-remove"></i>删除</a>');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });

        /** 刷新参数缓存 */
        function refreshCache() {
            $.operate.get(prefix + "/refreshCache");
        }
    </script>
</body>
</html>
