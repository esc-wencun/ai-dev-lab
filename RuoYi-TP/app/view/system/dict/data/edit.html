<!DOCTYPE html>
<html lang="zh">
<head>
	{assign name="pageTitle" value="修改字典数据" /}
	{include file="include/header" /}
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-dict-edit">
			<input name="dictCode" type="hidden" value="{$dict.dict_code ?? ''}"/>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">字典标签：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="dictLabel" id="dictLabel" value="{$dict.dict_label ?? ''}" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">字典键值：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="dictValue" id="dictValue" value="{$dict.dict_value ?? ''}" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">字典类型：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" readonly="true" name="dictType" value="{$dict.dict_type ?? ''}">
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">样式属性：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" id="cssClass" name="cssClass" value="{$dict.css_class ?? ''}">
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">字典排序：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="dictSort" value="{$dict.dict_sort ?? ''}" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">回显样式：</label>
				<div class="col-sm-8">
					<select name="listClass" class="form-control m-b">
					    <option value="" {if condition="isset($dict) and $dict['list_class'] == ''"}selected{/if}>---请选择---</option>
	                    <option value="default" {if condition="isset($dict) and $dict['list_class'] == 'default'"}selected{/if}>默认</option>
	                    <option value="primary" {if condition="isset($dict) and $dict['list_class'] == 'primary'"}selected{/if}>主要</option>
	                    <option value="success" {if condition="isset($dict) and $dict['list_class'] == 'success'"}selected{/if}>成功</option>
	                    <option value="info" {if condition="isset($dict) and $dict['list_class'] == 'info'"}selected{/if}>信息</option>
	                    <option value="warning" {if condition="isset($dict) and $dict['list_class'] == 'warning'"}selected{/if}>警告</option>
	                    <option value="danger" {if condition="isset($dict) and $dict['list_class'] == 'danger'"}selected{/if}>危险</option>
	                </select>
	                <span class="help-block m-b-none"><i class="fa fa-info-circle"></i> table表格字典列显示样式属性</span>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">系统默认：</label>
				<div class="col-sm-8">
				    {volist name="yesNoDatas" id="vo"}<div class="radio-box">
						<input type="radio" id="isDefault{$i}" name="isDefault" value="{$vo.dict_value}" {if condition="$vo['dict_value'] == $dict['is_default']"}checked{/if}>
						<label for="isDefault{$i}">{$vo.dict_label}</label>
					</div>{/volist}
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">状态：</label>
				<div class="col-sm-8">
				    {volist name="datas" id="vo"}<div class="radio-box">
						<input type="radio" id="status{$i}" name="status" value="{$vo.dict_value}" {if condition="$vo['dict_value'] == $dict['status']"}checked{/if}>
						<label for="status{$i}">{$vo.dict_label}</label>
					</div>{/volist}
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">备注：</label>
				<div class="col-sm-8">
					<textarea id="remark" name="remark" class="form-control">{$dict.remark ?? ''}</textarea>
				</div>
			</div>
		</form>
	</div>
	{include file="include/footer" /}
	<script type="text/javascript">
		var prefix = ctx + "system/dict/data";

		$("#form-dict-edit").validate({
			rules:{
				dictSort:{
					digits:true
				},
			},
			focusCleanup: true
		});

		function submitHandler() {
	        if ($.validate.form()) {
	        	$.operate.save(prefix + "/edit", $('#form-dict-edit').serialize());
	        }
	    }
	</script>
</body>
</html>
