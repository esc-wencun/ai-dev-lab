<!DOCTYPE html>
<html lang="zh">
<head>
	{assign name="pageTitle" value="新增通知公告" /}
	{include file="include/header" /}
	{include file="include/summernote-css" /}
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-notice-add">
			<div class="form-group">
				<label class="col-sm-2 control-label is-required">公告标题：</label>
				<div class="col-sm-10">
					<input id="noticeTitle" name="noticeTitle" class="form-control" type="text" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">公告类型：</label>
				<div class="col-sm-10">
					<select name="noticeType" class="form-control m-b">
	                    {volist name="types" id="dict"}<option value="{$dict.dict_value}">{$dict.dict_label}</option>{/volist}
	                </select>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">公告内容：</label>
				<div class="col-sm-10">
				    <input id="noticeContent" name="noticeContent" type="hidden">
				    <div class="summernote"></div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">公告状态：</label>
				<div class="col-sm-10">
				    {volist name="datas" id="dict"}<div class="radio-box">
						<input type="radio" id="status{$i}" name="status" value="{$dict.dict_value}" {if condition="$dict['is_default'] == 'Y'"}checked{/if}>
						<label for="status{$i}">{$dict.dict_label}</label>
					</div>{/volist}
				</div>
			</div>
		</form>
	</div>
    {include file="include/footer" /}
    {include file="include/summernote-js" /}
    <script type="text/javascript">
        var prefix = ctx + "system/notice";

	    $('.summernote').summernote({
	    	placeholder: '请输入公告内容',
			height : 192,
			lang : 'zh-CN',
			followingToolbar: false,
			dialogsInBody: true,
			callbacks: {
                onImageUpload: function (files) {
                    sendFile(files[0], this);
                }
            }
		});

	    // 上传文件
	    function sendFile(file, obj) {
	        var data = new FormData();
	        data.append("file", file);
	        $.ajax({
	            type: "POST",
	            url: ctx + "common/upload",
	            data: data,
	            cache: false,
	            contentType: false,
	            processData: false,
	            dataType: 'json',
	            success: function(result) {
	                if (result.code == web_status.SUCCESS) {
	                	$(obj).summernote('editor.insertImage', result.url, result.fileName);
					} else {
						$.modal.alertError(result.msg);
					}
	            },
	            error: function(error) {
	                $.modal.alertWarning("图片上传失败。");
	            }
	        });
	    }

		$("#form-notice-add").validate({
			focusCleanup: true
		});

		function submitHandler() {
	        if ($.validate.form()) {
	        	var sHTML = $('.summernote').summernote('code');
				$("#noticeContent").val(sHTML);
				$.operate.save(prefix + "/add", $('#form-notice-add').serialize());
	        }
	    }
	</script>
</body>
</html>
