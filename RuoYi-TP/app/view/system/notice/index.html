<!DOCTYPE html>
<html lang="zh">
<head>
	{assign name="pageTitle" value="通知公告列表" /}
	{include file="include/header" /}
</head>
<body class="gray-bg">
	<div class="container-div">
		<div class="row">
			<div class="col-sm-12 search-collapse">
				<form id="notice-form">
					<div class="select-list">
						<ul>
							<li>
								公告标题：<input type="text" name="noticeTitle"/>
							</li>
							<li>
								操作人员：<input type="text" name="createBy"/>
							</li>
							<li>
								公告类型：<select name="noticeType">
									<option value="">所有</option>
									{volist name="types" id="dict"}<option value="{$dict.dict_value}">{$dict.dict_label}</option>{/volist}
								</select>
							</li>
							<li>
								<a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
								<a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
							</li>
						</ul>
					</div>
				</form>
			</div>

	       <div class="btn-group-sm" id="toolbar" role="group">
	            <a class="btn btn-success {:check_perm('system:notice:add') ? '' : 'hidden'}" onclick="$.operate.addFull()">
	                <i class="fa fa-plus"></i> 新增
	            </a>
	            <a class="btn btn-primary single disabled {:check_perm('system:notice:edit') ? '' : 'hidden'}" onclick="$.operate.editFull()">
		            <i class="fa fa-edit"></i> 修改
		        </a>
				<a class="btn btn-danger multiple disabled {:check_perm('system:notice:remove') ? '' : 'hidden'}" onclick="$.operate.removeAll()">
		            <i class="fa fa-remove"></i> 删除
		        </a>
	        </div>

	        <div class="col-sm-12 select-table table-striped">
			    <table id="bootstrap-table"></table>
			</div>
		</div>
	</div>

	{include file="include/footer" /}
	<script>
		var editFlag = '{:check_perm('system:notice:edit') ? '' : 'hidden'}';
		var removeFlag = '{:check_perm('system:notice:remove') ? '' : 'hidden'}';
		var types = {:json_encode($types)};
		var datas = {:json_encode($datas)};
		var prefix = ctx + "system/notice";

		$(function() {
		    var options = {
		        url: prefix + "/list",
		        viewUrl: prefix + "/view/{id}",
		        createUrl: prefix + "/add",
		        updateUrl: prefix + "/edit/{id}",
		        removeUrl: prefix + "/remove",
		        modalName: "公告",
		        columns: [{
		        	checkbox: true
		        },
		        {
		        	field: 'noticeId',
		        	title: '序号'
		        },
		        {
		            field: 'noticeTitle',
		            title: '公告标题',
		            formatter: function(value, row, index) {
		                return '<a href="javascript:void(0)" onclick="$.operate.view(\'' + row.noticeId + '\')">' + value + '</a>';
		            }
		        },
		        {
		            field: 'noticeType',
		            title: '公告类型',
		            align: 'center',
		            formatter: function(value, row, index) {
		            	return $.table.selectDictLabel(types, value);
		            }
		        },
		        {
		            field: 'status',
		            title: '状态',
		            align: 'center',
		            formatter: function(value, row, index) {
		            	return $.table.selectDictLabel(datas, value);
		            }
		        },
		        {
		        	field: 'createBy',
		        	title: '创建者'
		        },
		        {
		            field: 'createTime',
		            title: '创建时间',
		            sortable: true
		        },
		        {
		            title: '操作',
		            align: 'center',
		            formatter: function(value, row, index) {
		            	var actions = [];
		            	actions.push('<a class="btn btn-info btn-xs" href="javascript:void(0)" onclick="showReadUsers(\'' + row.noticeId + '\', \'' + row.noticeTitle + '\')"><i class="fa fa-eye"></i>阅读用户</a> ');
		            	actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.editFull(\'' + row.noticeId + '\')"><i class="fa fa-edit"></i>编辑</a> ');
		            	actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.noticeId + '\')"><i class="fa fa-remove"></i>删除</a>');
		                return actions.join('');
		            }
		        }]
		    };
		    $.table.init(options);
		});

		// 阅读用户
		function showReadUsers(noticeId, noticeTitle) {
		    var url = ctx + "system/notice/readUsers/" + noticeId;
		    $.modal.popupRight("「" + noticeTitle + "」阅读用户", url, '800px');
		}
	</script>
</body>
</html>
