<!DOCTYPE html>
<html lang="zh">
<head>
	{assign name="pageTitle" value="修改密码" /}
	{include file="include/header" /}
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-user-resetPwd">
			<input name="userId" type="hidden" value="{$user.user_id ?? $user.userId ?? ''}"/>
			<div class="form-group">
				<label class="col-sm-3 control-label">登录名称：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" readonly="true" name="loginName" value="{$user.login_name ?? $user.loginName ?? ''}"/>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">输入密码：</label>
				<div class="col-sm-8">
					<div class="input-group">
                        <input class="form-control" type="password" name="password" id="password" placeholder="请输入重置密码" value="{$initPassword}">
                        <span class="input-group-addon" title="重置密码,鼠标按下显示密码"
                            onmousedown="$('#password').attr('type','text')"
                            onmouseup="$('#password').attr('type','password')"><i class="fa fa-key"></i></span>
                    </div>
				</div>
			</div>
		</form>
	</div>
	{include file="include/footer" /}
	<script type="text/javascript">
		$("#form-user-resetPwd").validate({
			rules:{
				password:{
					required: true,
					minlength: 5,
					maxlength: 20,
					specialSign: true
				},
			},
			focusCleanup: true
		});

		function submitHandler() {
	        if ($.validate.form()) {
	        	$.operate.save(ctx + "system/user/resetPwd", $('#form-user-resetPwd').serialize());
	        }
	    }
	</script>
</body>

</html>
