# RuoYi 本地开发环境（MySQL 8.0 + Redis 7.0）
#
# 用法（在 docker 目录下执行，或加 -f 指定本文件）：
#   启动：   docker compose up -d
#   停止：   docker compose down          # 保留数据卷
#   停止并清空数据：docker compose down -v
#
# 首次启动时自动执行 docker/mysql/init/ 下的 SQL 脚本建库建表。
# 本文件只负责 MySQL 和 Redis，后端仍跑在本机 8080 端口（Java / Python / Go 任选其一）。
#
# 可选自定义：在 docker 目录放一个 .env 文件可覆盖默认端口/密码（见 .env.example）。
# MySQL 数据在命名卷 ruoyi-mysql-data，Redis 数据在 ruoyi-redis-data，删卷即完全重置。

services:
  mysql:
    image: mysql:8.0
    container_name: ruoyi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-111111}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ry-vue}
      MYSQL_USER: ${MYSQL_USER:-wencun}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-111111}
      TZ: Asia/Shanghai
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      # 关键：忽略客户端握手时请求的字符集，强制使用 utf8mb4。
      # 否则镜像初始化（docker-entrypoint 导入 SQL）的客户端默认 latin1，中文会双重编码变成乱码
      - --character-set-client-handshake=FALSE
      - --default-time-zone=+08:00
      - --lower_case_table_names=1
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ruoyi-mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-111111}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.0
    container_name: ruoyi-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-111111}
    # 密码通过 requirepass 设置；AOF 持久化，会话数据重启不丢
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-111111}", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ruoyi-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ruoyi-mysql-data:
  ruoyi-redis-data:
